services:
  domainhunter:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VERSION: ${DOMAINHUNTER_VERSION:-v2.0.0}
    image: domainhunter:latest
    container_name: DomainHunter
    restart: unless-stopped
    ports:
      - "${DOMAINHUNTER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DOMAINHUNTER_RDAP_BOOTSTRAP_URL: ${DOMAINHUNTER_RDAP_BOOTSTRAP_URL:-https://data.iana.org/rdap/dns.json}
      DOMAINHUNTER_WHO_DAT_URL: ${DOMAINHUNTER_WHO_DAT_URL:-}
      DOMAINHUNTER_WHO_DAT_API_KEY: ${DOMAINHUNTER_WHO_DAT_API_KEY:-}
      DOMAINHUNTER_VERCEL_WHO_DAT_URL: ${DOMAINHUNTER_VERCEL_WHO_DAT_URL:-https://rdap.re}
      DOMAINHUNTER_RDAP_ORG_URL: ${DOMAINHUNTER_RDAP_ORG_URL:-https://rdap.org}
      DOMAINHUNTER_WHOIS_FALLBACK_URL: ${DOMAINHUNTER_WHOIS_FALLBACK_URL:-}
      DOMAINHUNTER_WHOIS_FALLBACK_TLDS: ${DOMAINHUNTER_WHOIS_FALLBACK_TLDS:-im,do}
      DOMAINHUNTER_WHOIS_FALLBACK_TIMEOUT: ${DOMAINHUNTER_WHOIS_FALLBACK_TIMEOUT:-20}
      DOMAINHUNTER_WHOIS_LS_URL: ${DOMAINHUNTER_WHOIS_LS_URL:-https://whois.ls/json/}
      DOMAINHUNTER_WHOIS_LS_TLDS: ${DOMAINHUNTER_WHOIS_LS_TLDS:-im}
      DOMAINHUNTER_WHOIS_LS_TIMEOUT: ${DOMAINHUNTER_WHOIS_LS_TIMEOUT:-20s}
      # 可选：仅在 .im 其他查询源无法确认时调用 Spaceship 官方 API。
      # Key/Secret 只从环境注入，不提交到仓库。
      DOMAINHUNTER_SPACESHIP_API_URL: ${DOMAINHUNTER_SPACESHIP_API_URL:-https://spaceship.dev/api/v1}
      DOMAINHUNTER_SPACESHIP_API_KEY: ${DOMAINHUNTER_SPACESHIP_API_KEY:-}
      DOMAINHUNTER_SPACESHIP_API_SECRET: ${DOMAINHUNTER_SPACESHIP_API_SECRET:-}
      DOMAINHUNTER_SPACESHIP_TLDS: ${DOMAINHUNTER_SPACESHIP_TLDS:-im}
      DOMAINHUNTER_SPACESHIP_TIMEOUT: ${DOMAINHUNTER_SPACESHIP_TIMEOUT:-15s}
      # P1 AI：默认不启用；Key 从环境注入，UI 保存 Key 还需要 SECRET_KEY。
      DOMAINHUNTER_AI_API_KEY: ${DOMAINHUNTER_AI_API_KEY:-}
      DOMAINHUNTER_SECRET_KEY: ${DOMAINHUNTER_SECRET_KEY:-}
      # 严格 AI 估价默认只允许官方 DeepSeek；其他网关必须显式加入 allowlist。
      DOMAINHUNTER_AI_ALLOWED_HOSTS: ${DOMAINHUNTER_AI_ALLOWED_HOSTS:-api.deepseek.com}
      DOMAINHUNTER_ALLOW_INSECURE_AI_BASE_URL: ${DOMAINHUNTER_ALLOW_INSECURE_AI_BASE_URL:-false}
      # 旧版 P1 AI 兼容变量，严格估价不读取它。
      DOMAINHUNTER_AI_ALLOW_INSECURE_LOCAL: ${DOMAINHUNTER_AI_ALLOW_INSECURE_LOCAL:-false}
      # Cookie Secure：auto 会识别反向代理的 X-Forwarded-Proto
      DOMAINHUNTER_COOKIE_SECURE: ${DOMAINHUNTER_COOKIE_SECURE:-auto}
      DOMAINHUNTER_LOG_FORMAT: ${DOMAINHUNTER_LOG_FORMAT:-text}
    extra_hosts:
      - host.docker.internal:host-gateway
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
