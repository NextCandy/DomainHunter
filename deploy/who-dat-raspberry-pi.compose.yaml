# Raspberry Pi deployment for lissy93/who-dat.
# Clone who-dat into ./source before running this file. Keep WHO_DAT_AUTH_KEY
# in the deployment .env; the service is intentionally not exposed without auth.
services:
  who-dat:
    build:
      context: ./source
      args:
        VERSION: ${WHO_DAT_VERSION:-pi}
    image: who-dat:${WHO_DAT_VERSION:-pi}
    container_name: who-dat
    restart: unless-stopped
    ports:
      - "${WHO_DAT_PORT:-59090}:8080"
    environment:
      PORT: "8080"
      AUTH_KEY: ${WHO_DAT_AUTH_KEY:?WHO_DAT_AUTH_KEY is required}
      ENABLE_CACHE: ${WHO_DAT_ENABLE_CACHE:-true}
      CACHE_TTL_SECONDS: ${WHO_DAT_CACHE_TTL_SECONDS:-3600}
      LOOKUP_TIMEOUT_SECONDS: ${WHO_DAT_LOOKUP_TIMEOUT_SECONDS:-10}
      RATE_PER_MINUTE: ${WHO_DAT_RATE_PER_MINUTE:-120}
      RATE_BURST: ${WHO_DAT_RATE_BURST:-20}
      MAX_DOMAINS: ${WHO_DAT_MAX_DOMAINS:-10}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
